# Netlify config for a speedrungames.net game.
# Default: builds with Vite. To switch to a plain-static game (just
# an index.html at the root, no bundler), comment out `command` and
# set `publish = "."`.

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION            = "22"
  NPM_FLAGS               = "--no-audit --no-fund"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
